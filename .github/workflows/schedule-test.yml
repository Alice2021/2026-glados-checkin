
name: Schedule Test

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm trigger
        run: |
          echo "Trigger: ${{ github.event_name }}"
          date -u
